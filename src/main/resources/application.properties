spring.application.name=HomeScapeBackend


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homescapedb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connectionTimeout=30000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.servlet.multipart.max-file-size = 5MB
spring.servlet.multipart.max-request-size = 5MB

# Where uploaded property photos are stored (created on start-up).
homescape.upload-dir=${UPLOAD_DIR:uploads/}

# Optional first admin account. Both must be set for it to be created.
homescape.admin.username=${ADMIN_USERNAME:}
homescape.admin.password=${ADMIN_PASSWORD:}
